name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      # Minimum total test coverage of src/, in percent: 70% from 7 Nov (it was 50% from 5 Nov).
      COVERAGE_GATE: "70"
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: python -m compileall -q src

      - name: Lint
        run: ruff check --line-length 100 --select E,F,W,I .

      - name: Test with coverage gate
        run: >-
          pytest
          --cov=src
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under="$COVERAGE_GATE"

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        run: |
          {
            echo "## Test coverage (gate: ${COVERAGE_GATE}%)"
            echo
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
