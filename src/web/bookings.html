<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings · Digital Library</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/bookings.css">
  <script src="/js/app.js"></script>
  <script src="/js/booking-actions.js"></script>
</head>
<body>
<main>
  <h1>My Bookings</h1>
  <ul id="summary" class="booking-summary" aria-label="Booking summary"></ul>

  <form class="row" id="filter-form">
    <label for="status-filter">Status filter</label>
    <select id="status-filter" name="status">
      <option value="">All bookings</option>
      <option value="active">Active (Reserved + Borrowed)</option>
      <option value="reserved">Reserved</option>
      <option value="borrowed">Borrowed</option>
      <option value="overdue">Overdue</option>
      <option value="returned">Returned</option>
      <option value="cancelled">Cancelled</option>
      <option value="expired">Expired</option>
    </select>
  </form>

  <p id="status-msg" class="saved" role="status" aria-live="polite"></p>
  <p id="error-msg" class="error" role="alert"></p>
  <ul id="bookings-list" class="bookings-list"></ul>
</main>
<script>
  // DLBS-53: My Bookings screen (FR-B2, FR-B3, FR-B4, FR-B6, FR-B7, FR-B8, FR-B10).
  (() => {
    DL.requireLogin();

    const listEl = document.getElementById("bookings-list");
    const summaryEl = document.getElementById("summary");
    const filterEl = document.getElementById("status-filter");
    const statusMsgEl = document.getElementById("status-msg");
    const errorMsgEl = document.getElementById("error-msg");
    const bookCache = new Map();
    let cachedItems = [];

    document.getElementById("filter-form").addEventListener("submit", (e) => {
      e.preventDefault();
    });

    async function fetchBookDetails(bookId) {
      if (bookCache.has(bookId)) return bookCache.get(bookId);
      try {
        const book = await DL.api(`/api/books/${encodeURIComponent(bookId)}`);
        bookCache.set(bookId, book);
        return book;
      } catch {
        const fallback = { id: bookId, title: `Book #${bookId}`, author: "" };
        bookCache.set(bookId, fallback);
        return fallback;
      }
    }

    function renderSummary(items) {
      const activeCount = items.filter((b) => b.is_active).length;
      const reservedCount = items.filter((b) => b.status === "reserved").length;
      const borrowedCount = items.filter((b) => b.status === "borrowed").length;
      const overdueCount = items.filter((b) => b.overdue || b.is_overdue).length;

      const cards = [
        [`${activeCount} / 5`, "Active bookings"],
        [reservedCount, "Reserved holds"],
        [borrowedCount, "Currently borrowed"],
        [overdueCount, "Overdue"],
      ];
      summaryEl.innerHTML = cards.map(([val, label]) =>
        `<li><span class="stat-value">${DL.esc(val)}</span><span class="stat-label">${DL.esc(label)}</span></li>`
      ).join("");
    }

    function matchesFilter(b, filterVal) {
      if (!filterVal) return true;
      if (filterVal === "active") return Boolean(b.is_active);
      if (filterVal === "overdue") return Boolean(b.overdue || b.is_overdue);
      return b.status === filterVal;
    }

    function actionButtonsHtml(b, title) {
      const safeTitle = DL.esc(title);
      if (b.status === "reserved") {
        return `
          <button type="button" class="action-btn primary" data-action="borrow"
                  data-id="${DL.esc(b.id)}" aria-label="Borrow ${safeTitle}">Borrow</button>
          <button type="button" class="action-btn danger" data-action="cancel"
                  data-id="${DL.esc(b.id)}" aria-label="Cancel reservation for ${safeTitle}">Cancel</button>
        `;
      }
      if (b.status === "borrowed") {
        return `
          <button type="button" class="action-btn primary" data-action="return"
                  data-id="${DL.esc(b.id)}" aria-label="Return ${safeTitle}">Return</button>
        `;
      }
      return "";
    }

    async function renderList() {
      const filtered = cachedItems.filter((b) => matchesFilter(b, filterEl.value));
      if (!filtered.length) {
        listEl.innerHTML = filterEl.value
          ? `<li class="muted">No bookings match this filter.</li>`
          : `<li class="muted">You have no bookings yet. Visit a <a href="/catalog.html">book page</a> to reserve or borrow a copy.</li>`;
        return;
      }

      const uniqueIds = [...new Set(filtered.map((b) => b.book_id))];
      await Promise.all(uniqueIds.map(fetchBookDetails));

      listEl.innerHTML = filtered.map((b) => {
        const book = bookCache.get(b.book_id) || { title: `Book #${b.book_id}`, author: "" };
        const title = book.title || `Book #${b.book_id}`;
        const author = book.author ? `<p class="author">${DL.esc(book.author)}</p>` : "";
        return `
          <li class="booking-card" data-booking-id="${DL.esc(b.id)}">
            <div class="booking-meta">
              <h2><a href="/book.html?id=${encodeURIComponent(b.book_id)}">${DL.esc(title)}</a></h2>
              ${author}
              <div class="booking-badges">${DLBooking.statusBadgeHtml(b)}</div>
              ${DLBooking.formatDatesHtml(b)}
            </div>
            <div class="booking-actions">
              ${actionButtonsHtml(b, title)}
            </div>
          </li>
        `;
      }).join("");
    }

    async function load() {
      errorMsgEl.textContent = "";
      try {
        const data = await DL.api("/api/bookings/me");
        cachedItems = (data && data.items) || [];
        renderSummary(cachedItems);
        await renderList();
      } catch (err) {
        if (err && err.status === 401) return DL.requireLogin();
        errorMsgEl.textContent = (err && err.message) || "Failed to load your bookings.";
      }
    }

    filterEl.addEventListener("change", renderList);

    listEl.addEventListener("click", async (event) => {
      const btn = event.target.closest("button[data-action]");
      if (!btn || btn.disabled) return;

      const action = btn.dataset.action;
      const bookingId = btn.dataset.id;
      const card = btn.closest(".booking-card");
      const buttons = card ? card.querySelectorAll("button.action-btn") : [btn];
      buttons.forEach((b) => { b.disabled = true; });
      errorMsgEl.textContent = "";
      statusMsgEl.textContent = "";

      try {
        if (action === "borrow") {
          const res = await DL.api(`/api/bookings/${bookingId}/borrow`, { method: "POST" });
          statusMsgEl.textContent = `Borrowed successfully. Due on ${res.due_date}.`;
        } else if (action === "return") {
          await DL.api(`/api/bookings/${bookingId}/return`, { method: "POST" });
          statusMsgEl.textContent = "Book returned and copy restored to catalog.";
        } else if (action === "cancel") {
          await DL.api(`/api/bookings/${bookingId}`, { method: "DELETE" });
          statusMsgEl.textContent = "Reservation cancelled.";
        }
        await load();
      } catch (err) {
        buttons.forEach((b) => { b.disabled = false; });
        if (err && err.status === 401) return DL.requireLogin();
        errorMsgEl.textContent = (err && err.message) || "Booking action failed.";
      }
    });

    load();
  })();
</script>
</body>
</html>
