<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Bookings · Digital Library</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/app.js"></script>
</head>
<body>
<main>
  <h1>My Bookings</h1>
  <p class="muted">Manage your active reservations, borrowed books, loan due dates, and return history.</p>

  <div id="status-alert" role="status"></div>

  <div class="row" style="margin-bottom: 16px;">
    <label>Filter Status
      <select id="status-filter">
        <option value="">All Bookings</option>
        <option value="active" selected>Active Only (Reserved & Borrowed)</option>
        <option value="reserved">Reserved (Awaiting Pickup)</option>
        <option value="borrowed">Borrowed (On Loan)</option>
        <option value="returned">Returned</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </label>
  </div>

  <section>
    <div id="bookings-list"></div>
  </section>
</main>

<script>
  // DLBS-45, DLBS-51: My bookings list, actions (borrow, return, cancel), due dates, and overdue alerts.
  DL.requireLogin();

  const statusAlert = document.getElementById("status-alert");
  const bookingsContainer = document.getElementById("bookings-list");
  const statusFilter = document.getElementById("status-filter");

  // In-memory cache for book details to avoid redundant network queries
  const bookCache = new Map();

  async function getBookInfo(bookId) {
    if (bookCache.has(bookId)) return bookCache.get(bookId);
    try {
      const book = await DL.api(`/api/books/${bookId}`);
      bookCache.set(bookId, book);
      return book;
    } catch {
      return { id: bookId, title: `Book #${bookId}`, author: "Library Catalog" };
    }
  }

  function formatDate(isoStr) {
    if (!isoStr) return "N/A";
    const d = new Date(isoStr);
    return isNaN(d.getTime()) ? isoStr : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  async function loadBookings() {
    statusAlert.className = "alert info";
    statusAlert.textContent = "Loading your bookings...";
    bookingsContainer.innerHTML = "";

    try {
      const data = await DL.api("/api/bookings/me");
      statusAlert.textContent = "";
      statusAlert.className = "";

      let items = data.items || [];
      const filterVal = statusFilter.value;

      if (filterVal === "active") {
        items = items.filter((b) => b.is_active || b.status === "reserved" || b.status === "borrowed");
      } else if (filterVal) {
        items = items.filter((b) => b.status === filterVal);
      }

      if (items.length === 0) {
        bookingsContainer.innerHTML = `
          <div class="panel" style="text-align: center; padding: 32px 16px;">
            <p class="muted">No bookings match this filter.</p>
            <p><a href="/catalog.html" class="primary" style="display: inline-block; padding: 7px 16px; text-decoration: none;">Browse Catalog to Borrow</a></p>
          </div>
        `;
        return;
      }

      // Render cards
      const htmlList = [];
      for (const b of items) {
        const book = await getBookInfo(b.book_id);
        const isOverdue = b.is_overdue || b.overdue;

        let statusBadge = "";
        let actionsHtml = "";

        if (b.status === "reserved") {
          statusBadge = `<span class="badge reserved">Reserved (Hold)</span>`;
          actionsHtml = `
            <button class="primary small btn-borrow" data-id="${b.id}">Borrow Book (14-Day Loan)</button>
            <button class="secondary small btn-cancel" data-id="${b.id}">Cancel Hold</button>
          `;
        } else if (b.status === "borrowed") {
          statusBadge = isOverdue
            ? `<span class="badge overdue">OVERDUE</span>`
            : `<span class="badge borrowed">Borrowed</span>`;
          actionsHtml = `
            <button class="primary small btn-return" data-id="${b.id}">Return Book</button>
          `;
        } else if (b.status === "returned") {
          statusBadge = `<span class="badge returned">Returned</span>`;
        } else if (b.status === "cancelled") {
          statusBadge = `<span class="badge cancelled">Cancelled</span>`;
        }

        htmlList.push(`
          <div class="booking-card" id="booking-${b.id}">
            <div class="booking-info">
              <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 6px;">
                ${statusBadge}
                ${isOverdue ? '<span class="badge danger">Action Required</span>' : ''}
              </div>
              <h3><a href="/book.html?id=${encodeURIComponent(b.book_id)}">${DL.esc(book.title)}</a></h3>
              <p class="author">${DL.esc(book.author)}</p>
              <div class="booking-dates">
                <span><strong>Created:</strong> ${formatDate(b.created_at || b.reserved_at)}</span>
                ${b.status === 'reserved' && b.expires_at ? `<span><strong>Hold Expires:</strong> ${formatDate(b.expires_at)}</span>` : ''}
                ${b.due_date ? `<span><strong>Due Date:</strong> ${formatDate(b.due_date)}</span>` : ''}
                ${b.returned_at ? `<span><strong>Returned On:</strong> ${formatDate(b.returned_at)}</span>` : ''}
              </div>
            </div>
            <div class="booking-actions">
              ${actionsHtml}
            </div>
          </div>
        `);
      }

      bookingsContainer.innerHTML = htmlList.join("");
      attachActionListeners();
    } catch (err) {
      statusAlert.className = "alert error";
      statusAlert.textContent = "Failed to load bookings: " + err.message;
    }
  }

  function attachActionListeners() {
    // Borrow Action
    document.querySelectorAll(".btn-borrow").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id;
        btn.disabled = true;
        try {
          await DL.api(`/api/bookings/${id}/borrow`, { method: "POST" });
          statusAlert.className = "alert success";
          statusAlert.textContent = "Book borrowed successfully! Your 14-day loan has started.";
          loadBookings();
        } catch (err) {
          btn.disabled = false;
          statusAlert.className = "alert error";
          statusAlert.textContent = err.message || "Failed to borrow book.";
        }
      });
    });

    // Return Action
    document.querySelectorAll(".btn-return").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id;
        btn.disabled = true;
        try {
          await DL.api(`/api/bookings/${id}/return`, { method: "POST" });
          statusAlert.className = "alert success";
          statusAlert.textContent = "Book returned successfully. Thank you!";
          loadBookings();
        } catch (err) {
          btn.disabled = false;
          statusAlert.className = "alert error";
          statusAlert.textContent = err.message || "Failed to return book.";
        }
      });
    });

    // Cancel Action
    document.querySelectorAll(".btn-cancel").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id;
        if (!confirm("Are you sure you want to cancel this reservation?")) return;
        btn.disabled = true;
        try {
          await DL.api(`/api/bookings/${id}`, { method: "DELETE" });
          statusAlert.className = "alert success";
          statusAlert.textContent = "Reservation cancelled successfully.";
          loadBookings();
        } catch (err) {
          btn.disabled = false;
          statusAlert.className = "alert error";
          statusAlert.textContent = err.message || "Failed to cancel reservation.";
        }
      });
    });
  }

  statusFilter.addEventListener("change", loadBookings);
  loadBookings();
</script>
</body>
</html>
