<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Digital Library</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/app.js"></script>
</head>
<body>
<main>
  <h1>Log in</h1>
  <form id="login" class="row" novalidate>
    <label>Email <input id="email" type="email" autocomplete="email" required></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Log in</button>
  </form>
  <p id="msg" class="error" role="alert"></p>
</main>
<script>
  document.getElementById("login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    msg.textContent = "";
    try {
      await DL.login(document.getElementById("email").value, document.getElementById("password").value);
      const next = new URLSearchParams(location.search).get("next");
      location.href = next && next.startsWith("/") ? next : "/";
    } catch (err) {
      msg.textContent = err.message;
    }
  });
</script>
</body>
</html>
