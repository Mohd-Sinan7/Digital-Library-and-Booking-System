<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · Digital Library</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/users.css">
  <script src="/js/app.js"></script>
</head>
<body>
<main>
  <h1>Create an account</h1>
  <form id="register" class="stack" novalidate>
    <label>Name <input id="name" autocomplete="name" maxlength="100" required></label>
    <label>Email <input id="email" type="email" autocomplete="email" required></label>
    <label>Password
      <input id="password" type="password" autocomplete="new-password" required
             aria-describedby="password-hint">
    </label>
    <p id="password-hint" class="muted hint">At least 8 characters, with a letter and a digit.</p>
    <button class="primary" type="submit">Create account</button>
  </form>
  <p id="msg" class="error" role="alert"></p>
  <p>Already have an account? <a href="/login.html">Log in</a></p>
</main>
<script>
  // FR-U1: register, then log in with the same details and go to My Reading.
  document.getElementById("register").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    const button = e.target.querySelector("button");
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    msg.textContent = "";
    if (!name || !email || !password) {
      msg.textContent = "Fill in your name, email and password.";
      return;
    }
    button.disabled = true;
    try {
      await DL.api("/api/auth/register", { method: "POST", body: { name, email, password } });
      await DL.login(email, password);
      const next = new URLSearchParams(location.search).get("next");
      location.href = next && next.startsWith("/") ? next : "/reading.html";
    } catch (err) {
      // Validation messages arrive as "password: Value error, ..."; keep the readable part.
      msg.textContent = err.message.replace(/Value error, /g, "");
      button.disabled = false;
    }
  });
</script>
</body>
</html>
